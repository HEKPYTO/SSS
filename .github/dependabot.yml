version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - github-actions

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - pre-commit
