[project]
name = "stochastic-sequential-search"
version = "0.1.0"
description = "Faithful Python implementation of stochastic sequential forward floating search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HE KYPTO", email = "zoonyanapat@gmail.com" }]
keywords = ["feature selection", "sSFFS", "stochastic search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy"]

[project.urls]
Paper = "https://doi.org/10.48550/arXiv.2608.01502"

[project.scripts]
sss = "sss.cli:main"
[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sss"]

[tool.hatch.build.targets.sdist]
exclude = ["anc/data/reuters_apte.arff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "SIM", "ARG", "BLE", "RUF"]
ignore = ["D", "S101", "S603", "S607", "S108", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true
